<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wanderbots</title>
<style>
:root{--bg:#111;--card:#1b1b1b;--line:#2a2a2a;--fg:#e8e8e8;--dim:#888;--ok:#5fd068;--warn:#e8b339;--bad:#e5534b}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--fg)}
main{max-width:1000px;margin:auto;padding:20px}h1{font-size:18px;margin:0 0 4px}h2{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:24px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.dim{color:var(--dim)}.sp{flex:1}
input,select,button{font:inherit;background:#0c0c0c;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input{width:120px}button{cursor:pointer}button:hover{border-color:#555}button.p{background:var(--fg);color:#000}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px 16px;margin:8px 0}.grid b{display:block;font-weight:normal;color:var(--dim);font-size:11px}
.set{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 20px}.set label{display:flex;justify-content:space-between;align-items:center;gap:8px}
.set input[type=number]{width:70px}.set input[type=checkbox]{width:auto}
.err{color:var(--bad);font-size:12px;word-break:break-all}
#login{max-width:320px;margin:18vh auto;padding:20px}#login input{width:100%;margin:10px 0}#login button{width:100%}
[hidden]{display:none!important}
</style></head><body>

<div id="login" class="card" hidden><h1>Wanderbots</h1><div class="dim">Enter your login key</div>
<form onsubmit="login(event)"><input id="lk" type="password" autocomplete="current-password" placeholder="key" autofocus><button class="p">Log in</button></form>
<div id="lerr" class="err"></div><div class="dim" style="font-size:12px;margin-top:10px">First start? The key is printed in the server log.</div></div>

<main id="app" hidden>
<div class="row"><h1>Wanderbots</h1><span class="sp"></span><button onclick="chkey()">Change key</button><button onclick="logout()">Log out</button></div>
<div id="srv" class="dim">…</div>

<h2>Server</h2><div class="card row">
<input id="host" placeholder="host" style="width:240px"><input id="port" placeholder="25565" style="width:80px">
<button onclick="api('server',{host:v('host'),port:v('port')})">Save &amp; reconnect</button></div>

<h2>Bot settings</h2><div class="card"><div class="set" id="set"></div>
<div class="row" style="margin-top:12px"><span class="sp"></span><button class="p" onclick="saveSet()">Save settings</button></div></div>

<h2>Bots</h2><div class="card row"><input id="nb" placeholder="username"><button class="p" onclick="api('bots',{name:v('nb')}).then(j=>j&&(nb.value=''))">+ Add bot</button></div>
<div id="bots"></div>

<h2>Places</h2><div class="card row">
<input id="pn" placeholder="name e.g. farm"><input id="px" placeholder="x" style="width:70px"><input id="py" placeholder="y" style="width:70px"><input id="pz" placeholder="z" style="width:70px">
<button onclick="api('places',{name:v('pn'),x:v('px'),y:v('py'),z:v('pz')})">Save place</button></div>
<div id="places"></div>
</main><script>
const $=id=>document.getElementById(id),v=id=>$(id).value.trim(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';')
let tok=localStorage.t||'',S,setDrawn=0
const F=[['version','Minecraft version','sel'],['view','View distance','view'],['roam','Roam radius (blocks)','num'],['homeR','Stay radius at a place','num'],
 ['reconnect','Reconnect delay (s)','num'],['lookPlayers','Look at nearby players','chk'],['eat','Eat when hungry','chk'],['fidget','Jump / sneak / swing','chk'],['sprint','Sprint when walking','chk']]
function show(ok){$('login').hidden=ok;$('app').hidden=!ok}
async function api(p,b,m){const r=await fetch('/api/'+p,{method:m||(b?'POST':'GET'),headers:{'x-token':tok,'content-type':'application/json'},body:b&&JSON.stringify(b)})
 const j=await r.json().catch(()=>({}));if(r.status==401){tok=localStorage.t='';show(false);return}
 if(j.error){alert(j.error);return}if(j.relogin){alert('Key changed. Log in with the new key.');tok=localStorage.t='';show(false);return}if(b||m)load();return j}
async function login(e){e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key:$('lk').value})}),j=await r.json()
 if(j.token){tok=localStorage.t=j.token;$('lk').value='';$('lerr').textContent='';show(true);setDrawn=0;load()}else $('lerr').textContent=j.error}
function logout(){api('logout',{});tok=localStorage.t='';show(false)}
function chkey(){const k=prompt('New login key (8+ characters)');k&&api('key',{key:k})}
function drawSet(){$('set').innerHTML=F.map(([k,l,t])=>{const x=S.set[k]
 const i=t=='chk'?`<input type=checkbox id="c_${k}" ${x?'checked':''}>`:t=='num'?`<input type=number min=0 max=64 id="c_${k}" value="${x}">`
 :`<select id="c_${k}">${(t=='sel'?S.versions:['tiny','short','normal']).map(o=>`<option ${o==x?'selected':''}>${esc(o)}</option>`).join('')}</select>`
 return `<label>${l}${i}</label>`}).join('');setDrawn=1}
function saveSet(){const o={};F.forEach(([k,,t])=>o[k]=t=='chk'?$('c_'+k).checked:$('c_'+k).value);api('settings',o).then(()=>setDrawn=0)}
function fmt(s){return s>3600?(s/3600|0)+'h'+((s%3600)/60|0)+'m':s>60?(s/60|0)+'m':s+'s'}
async function load(){const j=await api('state');if(!j)return;S=j;show(true);const s=S.server,pl=Object.keys(S.places)
 $('srv').textContent=`${s.host}:${s.port} · ${s.server||'not reached'}${s.version?' → using '+s.version:''}${s.online!=null?' · '+s.online+'/'+s.max+' online':''}${s.motd?' · '+s.motd:''} · ${S.mem} MB RAM`
 if(!document.activeElement.matches('input')){host.value=s.host;port.value=s.port}
 if(!setDrawn)drawSet()
 const opts=pl.map(p=>`<option>${esc(p)}</option>`).join('')
 $('bots').innerHTML=S.bots.map(b=>{const c=b.up?'var(--ok)':b.task=='offline'?'var(--bad)':'var(--warn)',n=esc(b.name)
  return `<div class="card"><div class="row"><span class="dot" style="background:${c}"></span><b>${n}</b><span class="dim">${esc(b.task)}</span><span class="sp"></span>
  <select id="s_${n}"><option value="">send to…</option>${opts}</select><button onclick="send('${n}')">Go</button>
  <button onclick="api('bots/${n}/roam',{})">Roam</button><button onclick="here('${n}')">Save spot</button>
  <button onclick="ren('${n}')">Rename</button><button onclick="api('bots/${n}/restart',{})">Rejoin</button><button onclick="confirm('Remove ${n}?')&&api('bots/${n}',null,'DELETE')">✕</button></div>
  <div class="grid"><div><b>health</b>${b.hp!=null?Math.round(b.hp)+'/20':'–'}</div><div><b>food</b>${b.food??'–'}</div><div><b>pos</b>${b.pos?b.pos.join(' '):'–'}</div>
  <div><b>world</b>${esc(b.dim?.replace('minecraft:','')||'–')}</div><div><b>ping</b>${b.ping!=null?b.ping+'ms':'–'}</div><div><b>uptime</b>${b.up?fmt(b.up):'–'}</div><div><b>players</b>${b.players??'–'}</div><div><b>place</b>${esc(b.at||'–')}</div></div>
  ${b.err?`<div class="err">${esc(b.err)}</div>`:''}</div>`}).join('')||'<div class="card dim">No bots yet.</div>'
 $('places').innerHTML=pl.map(p=>{const c=S.places[p];return `<div class="card row"><b>${esc(p)}</b><span class="dim">${c.x} ${c.y} ${c.z}</span><span class="sp"></span><button onclick="api('places/${encodeURIComponent(p)}',null,'DELETE')">✕</button></div>`}).join('')}
function send(n){const p=$('s_'+n).value;p&&api(`bots/${n}/send`,{place:p})}
function ren(n){const x=prompt('New username',n);x&&x!=n&&api(`bots/${n}/rename`,{name:x})}
function here(n){const x=prompt('Name this spot (e.g. farm)');x&&api(`bots/${n}/here`,{name:x})}
tok?load():show(false)
setInterval(()=>{if(tok&&!$('app').hidden&&!document.activeElement.matches('input,select'))load()},2000)
</script></body></html>
